<!-- Outer card with total subscribers -->
<div
  class="bg-white rounded-lg sm:rounded-xl border border-slate-200 mb-4 sm:mb-6 p-4 sm:p-6 shadow-sm overflow-hidden"
>
  <h1 class="m-0 mb-5 text-2xl sm:text-3xl font-bold text-slate-800">
    Registered Guests List
  </h1>
  <div
    class="border border-[#FEC281] bg-gradient-to-b from-[#EDE5DD] to-[#FFDEC6] w-[240px] shadow-sm shadow-[#AE7F38]"
  >
    <div class="relative z-20 p-3">
      <p class="nav text-[30px]">{{ filteredUsers.length }}</p>
      <p class="text-[14px] text-[#666666]">Total Active Subscribers</p>
    </div>
  </div>
</div>

<!-- Search input + table -->
<div
  [formGroup]="searchForm"
  class="bg-white rounded-lg sm:rounded-xl py-4 sm:py-6 shadow-sm overflow-hidden"
>
  <div class="doc-input mx-2">
    <input
      type="text"
      formControlName="Number"
      placeholder="find with phone and Name"
      class="placeholder:text-[16px] placeholder:text-[#666666]"
    />
    <button
      type="button"
      (click)="onSearch()"
      class="icon-btn"
      aria-label="search"
    >
      <img src="assets/img/searchIcon.png" alt="" class="w-[21px]" />
    </button>
  </div>

  <div class="overflow-hidden py-4">
    <table class="w-full table-auto text-xs sm:text-sm md:text-base">
      <thead class="bg-[#343345]">
        <tr>
          <th>No</th>
          <th>Name</th>
          <th>VMY Code</th>
          <th>Phone</th>
          <th>Organization</th>
          <th>Registered Date&Time</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of filteredUsers; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.vmyCode }}</td>
          <td>{{ user.phoneNumber }}</td>
          <td>{{ user.organization }}</td>
          <td>{{ user.registeredAt | date: "dd/MM/yyyy HH:mm" }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
