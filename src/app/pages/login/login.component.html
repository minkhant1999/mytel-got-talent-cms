<div class="min-h-screen flex items-center justify-center bg-slate-100 px-3 py-6 sm:px-4 sm:py-8 md:px-6">
  <div class="w-full max-w-[min(100%,28rem)] bg-white rounded-xl sm:rounded-2xl border border-slate-200 shadow-lg p-6 sm:p-8">
    <div class="text-center mb-6 sm:mb-8">
      <h1 class="text-xl sm:text-2xl font-bold text-slate-800 m-0 mb-1">MyTel Got Talent</h1>
      <p class="text-slate-500 text-xs sm:text-sm m-0">Sign in to continue</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4 sm:space-y-5">
      <div>
        <label for="username" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1.5">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          class="w-full px-3 py-2 sm:px-4 sm:py-2.5 border border-slate-200 rounded-lg text-slate-800 text-sm sm:text-base placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20"
          placeholder="Enter username"
          required
          autocomplete="username">
      </div>

      <div>
        <label for="password" class="block text-xs sm:text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full px-3 py-2 sm:px-4 sm:py-2.5 border border-slate-200 rounded-lg text-slate-800 text-sm sm:text-base placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20"
          placeholder="Enter password"
          required
          autocomplete="current-password">
      </div>

      <p *ngIf="error" class="text-red-600 text-xs sm:text-sm m-0">{{ error }}</p>

      <button
        type="submit"
        class="w-full py-2.5 px-4 sm:py-3 rounded-lg text-sm font-medium text-white bg-amber-500 border-0 cursor-pointer transition-colors hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 active:bg-amber-700 touch-manipulation">
        Sign in
      </button>
    </form>
  </div>
</div>
