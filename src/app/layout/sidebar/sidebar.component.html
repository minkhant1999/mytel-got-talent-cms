<aside
  class="sidebar fixed left-0 top-0 bottom-0 z-[100] flex flex-col bg-[#14121F] shadow-lg transition-[transform,width] duration-250 w-[260px] -translate-x-full md:translate-x-0"
  [class.w-[72px]]="collapsed && !mobileOpen"
>
  <div
    class="flex items-center gap-2 py-4 sm:py-5 min-h-[56px] sm:min-h-[64px] border-b border-white/10 shrink-0"
  >
    <img src="assets/img/logo.png" alt="" class="w-14" />
    <span
      class="nav font-bold text-xs sm:text-sm tracking-tight whitespace-nowrap overflow-hidden text-[#F3DED2]"
      *ngIf="!collapsed || mobileOpen"
      >MyTel Got Talent</span
    >
    >
  </div>
  <nav
    class="flex-1 py-3 px-2 sm:py-4 sm:px-3 overflow-y-auto overflow-x-hidden"
  >
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.path === '/voting-result' }"
      class="nav flex items-center gap-2 sm:gap-2 px-2 py-2.5 sm:px-3 sm:py-3 rounded-lg text-slate-400 no-underl ine transition-colors hover:bg-white/5 hover:text-slate-200 mb-1 whitespace-nowrap text-xs sm:text-sm"
      [title]="collapsed && !mobileOpen ? item.label : null"
    >
      <img
        [src]="item.iconUrl"
        alt="{{ item.label }}"
        class="w-4 h-4 text-center shrink-0"
      />

      <span *ngIf="!collapsed || mobileOpen">{{ item.label }}</span>
    </a>
  </nav>
  <!-- <button
    type="button"
    class="sidebar-toggle m-3 p-2 sm:m-4 sm:p-2 rounded-md bg-white/5 text-slate-400 flex items-center justify-center transition-colors hover:bg-white/10 hover:text-slate-200 hidden md:flex shrink-0"
    (click)="onToggle()"
    [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <span class="text-2xl font-light leading-none">{{ collapsed ? '›' : '‹' }}</span>
  </button> -->
</aside>
