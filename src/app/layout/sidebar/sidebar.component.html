<aside
  class="sidebar fixed left-0 top-0 bottom-0 z-[100] flex flex-col bg-gradient-to-b from-[#1a2332] to-[#0f1620] text-slate-200 shadow-lg transition-[width] duration-250 w-[260px]"
  [class.w-[72px]]="collapsed">
  <div class="flex items-center gap-3 px-5 py-5 min-h-[64px] border-b border-white/10">
    <span class="text-2xl text-amber-500 shrink-0">★</span>
    <span class="font-bold text-lg tracking-tight whitespace-nowrap overflow-hidden" *ngIf="!collapsed">MyTel Got Talent</span>
  </div>
  <nav class="flex-1 py-4 px-3 overflow-y-auto">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.path === '/voting-result' }"
      class="flex items-center gap-3.5 px-4 py-3 rounded-lg text-slate-400 no-underline transition-colors hover:bg-white/5 hover:text-slate-200 mb-1 whitespace-nowrap"
      [title]="collapsed ? item.label : null">
      <span class="material-icons text-[1.4rem] w-6 text-center shrink-0">{{ item.icon }}</span>
      <span *ngIf="!collapsed">{{ item.label }}</span>
    </a>
  </nav>
  <button
    type="button"
    class="sidebar-toggle m-4 p-2 rounded-md bg-white/5 text-slate-400 flex items-center justify-center transition-colors hover:bg-white/10 hover:text-slate-200"
    (click)="onToggle()"
    [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
    <span class="text-2xl font-light leading-none">{{ collapsed ? '›' : '‹' }}</span>
  </button>
</aside>
