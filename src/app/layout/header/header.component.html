<header class="flex items-center min-h-[56px] sm:min-h-[64px] px-3 sm:px-4 md:px-6 bg-white border-b border-slate-200 shadow-sm gap-2">
  <button
    type="button"
    class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 -ml-1 rounded-lg bg-transparent text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800 flex-shrink-0"
    (click)="onMenuClick()"
    aria-label="Toggle sidebar">
    <span class="material-icons text-2xl sm:text-3xl">menu</span>
  </button>
  <div class="flex-1 min-w-0"></div>
  <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
    <span class="flex items-center gap-1.5 sm:gap-2 px-2 py-1.5 sm:px-3 sm:py-2 rounded-lg text-slate-600 text-xs sm:text-sm min-w-0">
      <span class="material-icons text-2xl sm:text-3xl text-slate-400 flex-shrink-0">account_circle</span>
      <span class="font-medium truncate hidden sm:inline">Admin</span>
    </span>
    <button
      type="button"
      (click)="logout()"
      class="inline-flex items-center gap-1.5 sm:gap-2 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-lg text-xs sm:text-sm font-medium text-slate-600 bg-transparent border border-slate-200 cursor-pointer transition-colors hover:bg-slate-100 hover:border-slate-300 flex-shrink-0">
      <span class="material-icons text-lg sm:text-xl">logout</span>
      <span class="hidden sm:inline">Logout</span>
    </button>
  </div>
</header>
