<header class="flex items-center min-h-[64px] px-6 bg-white border-b border-slate-200 shadow-sm">
  <button
    type="button"
    class="flex items-center justify-center w-10 h-10 -mr-2 rounded-lg bg-transparent text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-800"
    (click)="onMenuClick()"
    aria-label="Toggle sidebar">
    <span class="material-icons text-3xl">menu</span>
  </button>
  <div class="flex-1"></div>
  <div class="flex items-center gap-4">
    <span class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 text-sm">
      <span class="material-icons text-3xl text-slate-400">account_circle</span>
      <span class="font-medium">Admin</span>
    </span>
    <button
      type="button"
      (click)="logout()"
      class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 bg-transparent border border-slate-200 cursor-pointer transition-colors hover:bg-slate-100 hover:border-slate-300">
      <span class="material-icons text-xl">logout</span>
      Logout
    </button>
  </div>
</header>
